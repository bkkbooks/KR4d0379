body:
  text: 嘉禾百咏别集類三宋提要臣等謹案嘉禾百咏一卷宋張堯同撰堯同秀州人仕履未詳詩中所詠會景亭為潘師旦所築趙老園為趙衮歸隱之處核其時代蓋寧宗以後人也宋世文人學士歌詠其土風之勝者往往以誇多鬬靡為工如阮閲郴江百詠許尚華亭百詠曾極金陵百詠之類所作皆以百首為率互相仿效勉強取盈不免沿為習套故堯同所咏嘉興一郡山川古迹亦以百篇槩之徐碩至元嘉禾志已與陸蒙老所賦嘉禾八詠同採入題詠門內後來作郡志者亦頗散見其間而托拾均未全備此乃其初出單行之本每首之後皆有附考不知何人所作舊有跋語亦不載姓名年月其詞雖不甚工而自吳越以後嘉興典故頗可得其梗概近時朱彞尊作鴛鴦湖棹歌一百首蓋即踵前例而稍變其面目者在彞尊詩筆之工麗固已後來居上而堯同採掇名目臚敘大凡其於地志考據要不為無助矣乾隆四十四年三月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:60d9c41776b4d109110cdba413bf96063d7410f8a0ce00004a43719728529be0
